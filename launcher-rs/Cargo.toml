[workspace]
members = ["crates/river-core", "crates/river-cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "LicenseRef-River"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
ed25519-dalek = "2.2.0"
base64 = "0.22.1"
sha2 = "0.10.9"
