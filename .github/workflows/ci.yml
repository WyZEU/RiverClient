name: CI

on:
  push:
  pull_request:

jobs:
  launcher-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: launcher/package-lock.json

      - name: Install launcher deps
        working-directory: launcher
        run: npm ci

      - name: Launcher syntax check
        run: |
          node --check launcher/src/main.js
          node --check launcher/src/preload.js
          node --check launcher/src/preload-updater.js
          node --check launcher/src/preload-logs.js
          node --check launcher/scripts/build-app.js

      - name: Launcher renderer build
        working-directory: launcher
        run: npm run build:app

      - name: Launcher and Worker tests
        run: node --test launcher/tests/*.test.js cloudflare-updates/tests/*.test.mjs

      - name: Release configuration check
        run: node launcher/scripts/prepare-windows-release.js --check

  mod-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: "temurin"

      # Builds the active Stonecutter targets and bootstrap (legacy/ is separate).
      # This ensures downloaded JARs can be checked against this source.
      - name: Build
        run: ./gradlew build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
