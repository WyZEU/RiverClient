name: Signed Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: river-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'WyZEU/RiverClient' && github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      RIVER_RELEASE_BUILD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify source and signing configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Release checkout must be clean and match the dispatched commit.'
          }
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure the repository secret $name before starting a release."
            }
          }
          "RIVER_SIGNING_LOG=$env:RUNNER_TEMP\river-signatures.jsonl" >> $env:GITHUB_ENV

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Set up Java 21 and 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Install dependencies and check release versions
        run: |
          npm ci --prefix launcher
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          node launcher/scripts/prepare-windows-release.js --check
          if ($LASTEXITCODE -ne 0) { throw 'Release version check failed.' }

      - name: Run launcher and Worker tests
        run: |
          $tests = @(Get-ChildItem launcher/tests/*.test.js, cloudflare-updates/tests/*.test.mjs | ForEach-Object FullName)
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript tests failed.' }

      - name: Build all Minecraft targets and bootstrap
        run: |
          & .\gradlew.bat build --no-daemon '-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64'
          if ($LASTEXITCODE -ne 0) { throw 'Minecraft runtime build failed.' }
          node launcher/scripts/prepare-windows-release.js
          if ($LASTEXITCODE -ne 0) { throw 'Runtime staging failed.' }

      - name: Install pinned Microsoft signing tools
        run: |
          $config = Get-Content -Raw launcher/windows-signing.json | ConvertFrom-Json
          Install-Module ArtifactSigning -RequiredVersion $config.moduleVersion -Force -Scope CurrentUser -Repository PSGallery

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and sign launcher, helper, NSIS and portable
        working-directory: launcher
        run: |
          npm run dist:windows:signed
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows packaging failed.' }

      - name: Verify signatures, installation and runtime; package artifacts
        run: ./launcher/scripts/verify-windows-release.ps1

      - name: Upload verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: river-windows-${{ github.sha }}
          path: launcher/dist/signed-release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload signing and installation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: river-windows-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/river-signatures.jsonl
            launcher/dist/windows-validation.json
          if-no-files-found: ignore
          retention-days: 14
